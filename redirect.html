<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
  (function () {
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(userAgent);

    const isIOS = (() => {
      const platform = navigator.platform;
      const maxTouch = navigator.maxTouchPoints || 0;

      // iPhone/iPod/iPad Classic
      if (/iPad|iPhone|iPod/.test(userAgent)) return true;

      // iPadOS 13+ in Desktop Mode (Safari fakes Mac)
      if (platform === 'MacIntel' && maxTouch > 1) return true;

      return false;
    })();

    if (isIOS) {
      window.location.href = "https://apps.apple.com/app/apple-store/id6737908364?pt=125904392&ct=QR%20Code&mt=8";
    } else if (isAndroid) {
      window.location.href = "https://play.google.com/store/apps/details?id=app.citytour.bamberg&referrer=utm_source%3Dqr%26utm_campaign%3Dqr_storelink";
    } else {
      window.location.href = "https://bambergstadtfuehrung.de/";
    }
  })();
</script>

</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://bambergstadtfuehrung.de/">
    <p>If you are not redirected, <a href="https://bambergstadtfuehrung.de/">click here</a>.</p>
  </noscript>
</body>
</html>
